# This repository's own configuration for the gate it ships, adopted deliberately in task
# 10.4 and not by an accidental smoke run. It carries only the keys that DEVIATE from the
# built-in defaults; everything absent is the shipped default, so this file reads as a list
# of decisions. Each deviation names what was measured, on Understand 6.5.1204.
#
# Run it with a bare `python` on PATH (`uv run scitools-hook check --all`). Without one,
# Understand analyses Python 2, 25 files of this repository fail to parse and the code after
# each failure is silently absent from the database (task 11.10).

[project]
# The default list, plus the fixture projects. `tests/fixtures/sample_project/` is analysis
# INPUT, not source: task 3.1 built it to contain a dependency cycle, a layer violation and a
# fan-out increase, and `tests/analysis/**` asserts the gate reports them. Gating on it would
# be gating on the test data -- measured, it contributes one `structure.file_cycle` and three
# threshold findings that exist because a test needs them to exist. Lists replace rather than
# merge, so the defaults are repeated here in full.
exclude = [
    ".git/**",
    "node_modules/**",
    ".venv/**",
    "venv/**",
    "build/**",
    "dist/**",
    "target/**",
    "__pycache__/**",
    "*.min.js",
    "*.generated.*",
    "*.lock",
    "uv.lock",
    "package-lock.json",
    "tests/fixtures/**",
]

# Two threshold deviations stood here until task 11.14 and both are gone, deliberately and
# with the measurement recorded, because the shipped defaults now carry what they carried.
#
# `[thresholds.routine] Essential = { max = 4, severity = "warning" }` was byte-for-byte what
# the default became: the guard-clause measurement behind it (six guards score Essential 7,
# the same logic as one elif ladder scores 1, both CyclomaticStrict 7) is now in
# `config/defaults.py`, and a deviation identical to the default is not a decision.
#
# `[thresholds.class] MaxInheritanceTree = 6` was raised because `class Model(BaseModel)`
# measured 5 and `class ModelChild(Model)` 6 -- pydantic's own base being four levels deep.
# Task 11.10 pinned the interpreter Understand analyses with, and a pinned interpreter cannot
# see pydantic: RE-MEASURED on this repository's 152 classes, the 54 that scored 6 now score
# 2, and the reason this line existed no longer exists. The default is now a warning, and the
# 5 findings it still raises here (four `Protocol` declarations and one exception subclass,
# each scoring 5) are left visible on purpose. Configuring them away would be this project
# teaching the habit its own defaults are written against.

[structure]
# One value written out in many files: the shape no complexity limit sees, because every
# file involved is fine on its own. Measured 2026-09-04 before the fix: 13 groups over 87
# findings, all of them the synthetic project's vocabulary copied into up to fourteen test
# modules each. They now live in tests/fixtures/.
duplicate_definitions = 3
# Raised from the default 5, with the measurement. A new test module for a feature in this
# package scores 7: five modules it actually names -- analysis.ratchet, config.metric_names,
# config.models, models.findings, models.snapshot -- plus src/scitools_hook/__init__.py and
# src/scitools_hook/models/__init__.py, which it never names and which Python executes on the
# way to the ones it does. 0.1.0a3 already stopped the rule charging for initialisers that
# hold NO code; these two hold some (a version string and a re-export list), so they are
# still counted, and the rule over-counts by about two for any file importing across this
# package. Measured 2026-09-04, on the third test module in a row that it refused.
max_new_dependencies_per_file = 7
# `log` and `pytestmark` are the per-module idiom: written out in every module on purpose.
# `FILES` is a false positive this rule produced on this repository and is worth recording:
# `FILES = tuple(sorted(SOURCES))` is textually identical in four contract modules, but each
# SOURCES is a DIFFERENT synthetic project. The rule compares initialiser text, so a value
# that references another module-level name is only really equal when that name is too.
duplicate_definitions_ignore = ["log", "logger", "pytestmark", "FILES"]

# --- limits measured from this repository, not assumed ---------------------------
# `scitools-hook recommend` over 5180 routines, 268 classes and 210 files, reporting a
# ceiling as fitting when it contains 95% of its population. Only the FILE scope moved:
# every routine and class ceiling came back `keep`, which is the answer that matters most --
# the shipped defaults fit this code, and only these three did not.
#
# `CountDeclFunction = 25` was not a limit here, it was noise: 69 of 210 files failed it, a
# third of the codebase. A limit two thirds of the tree meets is one somebody deletes.

[thresholds.file]
# 210 files: p50 145, p95 832, max 2987; 22 outside (10.5%) at 500, 5 outside (2.4%) at 1000
CountLineCode = { max = 1000, ratchet = false }
# 210 files: p50 15, p95 80, max 321; 69 outside (32.9%) at 25, 10 outside (4.8%) at 80
CountDeclFunction = { max = 80, ratchet = false }
# 210 files: p50 0, p95 6, max 19; 21 outside (10.0%) at 3, 7 outside (3.3%) at 6
CountDeclClass = { max = 6, ratchet = false }

# --- regions whose numbers are different in kind ---------------------------------
# Three files in src/ are held to file and class counts that they cannot meet, for reasons
# that are structural rather than about their quality. Each block below records the reason
# and the measurement; each sets a ceiling rather than switching the rule off, so growth
# past the ceiling still blocks and growth below it is still reported as a warning.

[scope.worker]
# understand/worker.py runs under Understand's own interpreter, where this package is not on
# sys.path. tests/test_import_direction.py holds it to `frozenset()` -- it may not import
# even the package leaf -- so it cannot be split, and the file limits ask for the one fix
# that is forbidden. Every feature that reaches the API therefore blocks on it.
# Measured 2026-09-04: 1056 lines, 117 functions, _Extractor 38 methods.
paths = ["src/scitools_hook/understand/worker.py"]

[scope.worker.thresholds.file]
CountLineCode = { max = 1200 }
CountDeclFunction = { max = 130 }

[scope.worker.thresholds.class]
CountDeclMethod = { max = 45 }
CountDeclMethodNonStub = { max = 45 }

[scope.schemas]
# models/ is a list of data shapes, not code with behaviour. `CountDeclClass = 3` assumes
# classes that do something; splitting a schema module by class count would scatter exactly
# the definitions `structure.duplicate_definition` exists to collect. `CountClassDerived` on
# the shared pydantic base counts schemas rather than coupling.
# Measured 2026-09-04: models/snapshot.py 11 classes, DataModel 43 derived.
#
# `config/models.py` joins them on 2026-09-05, for the same reason and with the same evidence:
# it is 20 pydantic settings shapes over one `StrictModel` base, one per TOML section or rule,
# and the two metrics that refuse it are the two named above. Measured when the
# understand-8-features spec added its `[analysis]` section: the file went 19 -> 20 classes
# against a limit of 6 and `StrictModel` 18 -> 19 derived against 8, so the ratchet refused a
# one-field settings model. Splitting the file does not answer `CountClassDerived` at all --
# the count is of everything sharing the base, wherever it lives -- which is the definition of
# a metric measuring the wrong thing here.
paths = ["src/scitools_hook/models/**", "src/scitools_hook/config/models.py"]

[scope.schemas.thresholds.file]
CountDeclClass = false

[scope.schemas.thresholds.class]
CountClassDerived = false



[scope.api_fakes]
# tests/understand/api_fakes.py is a stand-in for the `understand` module: one class per API
# type the worker reads (Ent, Ref, Kind, Arch, Db, the module itself, its exception, and
# `Metric` in its 7.x and 8.0 shapes), each with the methods the worker calls and no others.
# Its counts are the API's counts. `FakeEnt` has 16 methods because `understand.Ent` has
# those 16 the worker uses; a split would put half an entity in each file. The classes lived
# in test_worker.py until 0.1.0a7, where the ratchet carried them; moving them made every
# one "new" to the gate, since an entity's key includes its file.
# Measured 2026-09-05: 11 classes, 477 lines; FakeEnt 16 methods, FakeArch 7, FakeDb 7.
paths = ["tests/understand/api_fakes.py"]

[scope.api_fakes.thresholds.file]
CountDeclClass = false

[scope.api_fakes.thresholds.class]
CountDeclMethod = { max = 25 }
CountDeclMethodNonStub = { max = 25 }
