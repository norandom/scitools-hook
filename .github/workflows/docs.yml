# Publish the documentation site to GitHub Pages.
#
# This workflow is deliberately independent of `gate.yml` and `release.yml`. It needs no
# SciTools Understand, no licence and no project environment: the site is static Markdown
# built by mkdocs, and nothing in `docs/` imports the package.
#
# mkdocs is installed into a throwaway environment with `uv run --no-project` rather than
# being added to the project's dependency groups. That is the reason: `gate.yml` runs
# `uv sync --locked`, which fails on any pyproject/uv.lock mismatch, so adding a dependency
# group here would couple a documentation change to the lockfile. The versions below are
# pinned so a mkdocs release cannot turn this workflow red on its own.
#
# `--strict` is what makes this a gate rather than a publish step: a broken internal link, a
# nav entry pointing at a file that does not exist, or a page in `docs/` that no nav entry
# reaches all fail the build instead of shipping a broken site.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MKDOCS_MATERIAL_VERSION: "9.7.7"

jobs:
  build:
    name: build the site with --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --no-project: this build must not touch the package environment or the lockfile.
      - name: Build
        run: |
          uv run --no-project \
            --with "mkdocs-material==${MKDOCS_MATERIAL_VERSION}" \
            mkdocs build --strict --site-dir _site

      - name: Upload the artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishing is a separate job so that a pull request gets the --strict build without
  # needing the `pages` environment or write permission on it.
  deploy:
    name: publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
