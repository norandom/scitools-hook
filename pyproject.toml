[project]
name = "scitools-hook"
# 0.1.0a1: the first alpha. src/scitools_hook/__init__.py carries its own literal
# __version__, which the CLI prints for `--version`; the two are separate strings and
# nothing in the tree ties them together (measured -- see the release notes in
# .github/workflows/release.yml, whose verify step compares them and fails on a drift).
version = "0.1.0a1"
description = "Maintainability gate for git hooks and CI, backed by SciTools Understand."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # 0.27.2 is the floor, not a preference: cli/common.py builds its control-flow tuple
    # from typer.TyperException, which 0.12.5 and 0.27.1 do not define, so the CLI would
    # fail to import. Measured on all three. See tasks.md 9.1 round 4.
    "typer>=0.27.2",
    "rich>=13",
    "pydantic>=2.7",
    "platformdirs>=4",
]

[project.scripts]
scitools-hook = "scitools_hook.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitools_hook"]

[tool.hatch.build.targets.sdist]
# The sdist is a published file. Without this it carried the vendored Dagger SDK (52 files,
# +320 KB, measured by diffing the tarball before and after `dagger develop`) plus the
# agent-facing directories, none of which anyone installing this package needs.
exclude = [".dagger/module/sdk", ".agents", ".claude", ".kiro", "CLAUDE.md"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    # Parallel test execution. The suite is 3,788 tests with no hot spot -- the slowest is
    # 2.16s and the top fifteen sum to a quarter of the runtime -- so the cost is spread
    # across many subprocess-spawning tests, which is exactly the shape `-n` helps.
    "pytest-xdist>=3",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4",
    # .pre-commit-hooks.yaml is a contract with another tool, so the test parses it as YAML
    # rather than grepping its text (task 7.3).
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ".dagger/module/sdk" is the Dagger SDK that `dagger develop` vendors in. It is gitignored,
# and that is not enough: ruff only honours a .gitignore inside a git checkout. The licensed
# gate container runs over a plain copy of the tree, and `ruff check .` failed there on the
# SDK's own code; reproduced outside git on the host (a copy of .dagger/ plus this file, no
# .git) as 83 findings, every one inside the vendored SDK, dropping to zero with this entry
# while a deliberately unused import in the same directory was still reported.
extend-exclude = [".kiro", ".claude", ".dagger/module/sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP040/UP046/UP047 push PEP 695 type-parameter syntax (`def f[T](...)`, `type X = ...`).
# Understand 6.5 cannot parse a type-parameter list: one such declaration aborts the parse
# and takes the REST OF THE FILE out of the database, so the gate silently stops measuring
# there. Measured in task 10.4 -- five declarations cost five files, and the routine at the
# declaration swallowed the remainder of its file into its own metrics. This project has to
# be analysable by its own gate, so the older spelling stays until Understand catches up.
ignore = ["UP040", "UP046", "UP047"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
# `-n auto` by default. Measured on this 4-core machine: the unlicensed suite goes 88s -> 38s
# (2.3x) and the licensed one 289s -> 221s (1.3x -- those are dominated by real `und` analyses
# that do not parallelise well). Enabling it required fixing one test whose parametrize ids
# embedded a memory address, which made no two processes agree on the test's name.
# Use `-n 0` to force serial when debugging a test that shares state.
addopts = "-n auto"
testpaths = ["tests"]
markers = ["contract: requires a licensed SciTools Understand install"]
