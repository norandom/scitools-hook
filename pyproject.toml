[project]
name = "scitools-hook"
version = "0.1.0"
description = "Maintainability gate for git hooks and CI, backed by SciTools Understand."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "platformdirs>=4",
]

[project.scripts]
scitools-hook = "scitools_hook.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitools_hook"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".kiro", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contract: requires a licensed SciTools Understand install"]
